[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seraph-code-intelligence"
version = "0.1.0"
description = "Version-aware code retrieval for the Seraph hackathon"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]

[project.scripts]
seraph = "seraph.cli:main"
seraph-mcp = "seraph.server:main"

[tool.setuptools.packages.find]
where = ["src"]
